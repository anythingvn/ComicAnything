name: flutter_comic_reader
description: "A premium cross-platform PDF, EPUB, MOBI, and CBZ comic reader app with local storage & Google Drive support."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  pdfrx: ^1.0.45
  archive: ^3.4.10
  epubx: ^0.4.0
  googleapis: ^11.4.0
  google_sign_in: ^6.2.1
  http: ^1.2.0
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  file_picker: ^8.0.0
  shared_preferences: ^2.2.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/sample_cover.png
